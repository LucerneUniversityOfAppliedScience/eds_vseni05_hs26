<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #0B6E4F; stroke-width: 2; rx: 10; }
    .src { fill: #F4F7F5; stroke: #7A9E7E; stroke-width: 1.5; }
    .bronze { fill: #F6E7D8; stroke: #B07240; stroke-width: 2; }
    .silver { fill: #EEF0F2; stroke: #8A949C; stroke-width: 2; }
    .gold { fill: #FBF1D3; stroke: #C99A1E; stroke-width: 2; }
    .out { fill: #E3F1EA; stroke: #0B6E4F; stroke-width: 2; }
    .t { font-size: 15px; font-weight: bold; fill: #14231C; }
    .s { font-size: 12px; fill: #3F4F47; }
    .lbl { font-size: 12px; fill: #0B6E4F; font-weight: bold; }
    .arrow { stroke: #4A5A52; stroke-width: 2; fill: none; marker-end: url(#a); }
    .dab { fill: none; stroke: #2272B4; stroke-width: 1.5; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5A52"/>
    </marker>
  </defs>

  <rect class="dab" x="10" y="10" width="940" height="280" rx="14"/>
  <text x="26" y="34" font-size="13" fill="#2272B4" font-weight="bold">Declarative Automation Bundle · databricks bundle deploy</text>

  <!-- sources -->
  <rect class="src" x="30" y="60" width="150" height="56" rx="8"/>
  <text class="t" x="44" y="84">Bike/ped. counts</text>
  <text class="s" x="44" y="103">Open Data Zurich</text>
  <rect class="src" x="30" y="128" width="150" height="56" rx="8"/>
  <text class="t" x="44" y="152">Car traffic counts</text>
  <text class="s" x="44" y="171">Open Data Zurich</text>
  <rect class="src" x="30" y="196" width="150" height="56" rx="8"/>
  <text class="t" x="44" y="220">Weather</text>
  <text class="s" x="44" y="239">Open-Meteo</text>

  <!-- volume -->
  <rect class="box" x="215" y="110" width="120" height="90" rx="10" fill="#fff" stroke="#0B6E4F" stroke-width="2"/>
  <text class="t" x="230" y="140">Volume</text>
  <text class="s" x="230" y="160">mobility_raw.</text>
  <text class="s" x="230" y="176">landing</text>
  <text class="lbl" x="200" y="272">Setup job</text>

  <path class="arrow" d="M182,88 C200,88 200,140 213,140"/>
  <path class="arrow" d="M182,156 L213,156"/>
  <path class="arrow" d="M182,224 C200,224 200,172 213,172"/>

  <!-- medallion -->
  <rect class="bronze" x="370" y="110" width="120" height="90" rx="10"/>
  <text class="t" x="385" y="140">Bronze</text>
  <text class="s" x="385" y="160">raw data 1:1</text>
  <text class="s" x="385" y="176">as Delta tables</text>

  <rect class="silver" x="520" y="110" width="120" height="90" rx="10"/>
  <text class="t" x="535" y="140">Silver</text>
  <text class="s" x="535" y="160">cleaned, typed,</text>
  <text class="s" x="535" y="176">hourly grain</text>

  <rect class="gold" x="670" y="110" width="120" height="90" rx="10"/>
  <text class="t" x="685" y="140">Gold</text>
  <text class="s" x="685" y="160">daily, joined,</text>
  <text class="s" x="685" y="176">key figures</text>

  <path class="arrow" d="M337,155 L368,155"/>
  <path class="arrow" d="M492,155 L518,155"/>
  <path class="arrow" d="M642,155 L668,155"/>
  <text class="lbl" x="420" y="236">Project notebooks (by hand) or Lakeflow pipeline (automated)</text>

  <!-- outputs -->
  <rect class="out" x="820" y="70" width="115" height="60" rx="8"/>
  <text class="t" x="834" y="96">Dashboard</text>
  <text class="s" x="834" y="115">AI/BI</text>
  <rect class="out" x="820" y="180" width="115" height="60" rx="8"/>
  <text class="t" x="834" y="206">Genie</text>
  <text class="s" x="834" y="225">ask in plain English</text>
  <path class="arrow" d="M792,140 C805,140 805,100 818,100"/>
  <path class="arrow" d="M792,170 C805,170 805,210 818,210"/>
</svg>
