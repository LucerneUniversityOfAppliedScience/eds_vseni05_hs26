# Reference solution of project step 6.
# AI/BI dashboard on the project's gold tables. Queries in the .lvdash.json use bare table names;
# catalog/schema are set here. Switch dataset_schema to mobility_pipeline to use the pipeline output instead.
resources:
  dashboards:
    mobility_dashboard:
      display_name: "Bike vs car in Zurich"
      file_path: ../src/03_project/reference/dashboard/mobility.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${resources.schemas.gold_schema.name}
